name: Release Plugin

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  release:
    runs-on: ubuntu-latest
    name: Release WordPress Plugin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Record release
        id: release
        uses: groo-dev/record-release@v1
        with:
          token: ${{ secrets.GROO_PLUGIN_TOKEN }}
          environment: production
          bump: ${{ inputs.bump || 'patch' }}
          release-prefix: plugin
          artifacts: mira-verify.zip

      - name: Update plugin version
        run: |
          VERSION=${{ steps.release.outputs.version }}
          sed -i "s/Version: .*/Version: ${VERSION}/" wordpress-plugin/mira-verify.php
          sed -i "s/define('MIRA_VERIFY_VERSION', '.*')/define('MIRA_VERIFY_VERSION', '${VERSION}')/" wordpress-plugin/mira-verify.php

      - name: Create plugin zip
        run: |
          cd wordpress-plugin
          zip -r ../mira-verify.zip . -x "*.git*" -x "*.zip"
